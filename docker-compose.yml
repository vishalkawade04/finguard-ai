version: "3"

services:

  backend:

    build: .

    container_name: finguard-backend

    ports:
      - "5000:5000"

    environment:
      - MONGO_URI=mongodb://mongo:27017/finguard
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET}

    depends_on:
      - mongo

    restart: always
    healthcheck:
      test: ["CMD-SHELL", "(command -v curl >/dev/null 2>&1 && curl -f http://localhost:5000/health) || (command -v wget >/dev/null 2>&1 && wget -q --spider http://localhost:5000/health) || (node -e \"require('http').get('http://localhost:5000/health',res=>{if(res.statusCode!==200)process.exit(1)})\")"]
      interval: 10s
      timeout: 5s
      retries: 5


  frontend:

    build: ./frontend

    container_name: finguard-frontend

    environment:
      - NODE_ENV=production

    ports:
      - "80:80"

    restart: always
    healthcheck:
      test: ["CMD-SHELL", "(command -v curl >/dev/null 2>&1 && curl -f http://localhost/) || (command -v wget >/dev/null 2>&1 && wget -q --spider http://localhost/) || exit 0"]
      interval: 30s
      timeout: 5s
      retries: 3

    restart: always


  mongo:

    image: mongo

    container_name: finguard-mongo

    ports:
      - "27017:27017"

    volumes:
      - mongo-data:/data/db

    restart: always
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5


volumes:

  mongo-data: