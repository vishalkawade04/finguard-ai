apiVersion: v1
kind: Service
metadata:
  name: {{ include "finguard-chart.fullname" . }}
  labels:
    {{- include "finguard-chart.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.prometheusScrape.enabled }}
    prometheus.io/scrape: "true"
    prometheus.io/port: "{{ .Values.prometheusScrape.port }}"
    prometheus.io/path: "{{ .Values.prometheusScrape.path }}"
    {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "finguard-chart.selectorLabels" . | nindent 4 }}
