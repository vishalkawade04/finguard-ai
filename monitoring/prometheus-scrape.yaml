# Prometheus scrape config snippet for scraping FinGuard backend
# Add this to your Prometheus `scrape_configs` (prometheus.yml) or as a ServiceMonitor in your cluster.

- job_name: 'finguard-backend'
  metrics_path: '/metrics'
  static_configs:
    - targets: ['<BACKEND_HOST>:5000']

# Note: in Kubernetes, prefer ServiceMonitors (Prometheus Operator) or rely on annotations set in the Helm chart.
